name: Python CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install fastapi==0.118.0 uvicorn==0.23.2 SQLAlchemy==2.0.45 pydantic==2.8.2 httpx==0.24.1 pytest
    - name: Run Tests
      run: |
        source .venv/bin/activate
        python -m pytest -q
